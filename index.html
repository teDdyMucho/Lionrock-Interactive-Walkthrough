<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Rock — Projects</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    background:#0c0c0c;
    color:#f5f3ee;
    font-family:'Inter',sans-serif;
  }

  a{ color:inherit; text-decoration:none; }

  header{
    display:flex; align-items:center;
    padding:32px 48px;
  }
  header img{ height:30px; }

  h1{
    font-family:'Playfair Display',serif;
    font-weight:500;
    font-size:.85rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    opacity:.6;
    padding:0 48px;
    margin-bottom:26px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:28px;
    padding:0 48px 64px;
  }

  .card{
    display:block;
    border:1px solid rgba(245,243,238,.15);
    background:#000;
    transition:border-color .25s ease;
  }
  .card:hover{ border-color:rgba(245,243,238,.5); }

  .thumb{
    position:relative;
    aspect-ratio:16/10;
    overflow:hidden;
    background:#000;
  }
  .thumb video{
    width:100%; height:100%;
    object-fit:cover;
  }

  .card-title{
    padding:18px 20px 4px;
    font-family:'Playfair Display',serif;
    font-size:1.1rem;
  }
  .card-sub{
    padding:0 20px 20px;
    font-size:.8rem;
    letter-spacing:.02em;
    opacity:.55;
  }

  @media (max-width:600px){
    header{ padding:22px 24px; }
    h1{ padding:0 24px; }
    .grid{ padding:0 24px 40px; grid-template-columns:1fr; }
  }
</style>
</head>
<body>

  <header>
    <a href="https://example.com">
      <img src="/assets/img/lion-rock-logo.png" alt="Lion Rock">
    </a>
  </header>

  <h1>Projects</h1>

  <div class="grid">
    <a class="card" href="/2209-Branch-Ave-Anoka-MN-55303/">
      <div class="thumb">
        <video muted loop playsinline preload="metadata"
               src="/2209-Branch-Ave-Anoka-MN-55303/videos/2209-branch-ave/exterior.mp4"></video>
      </div>
      <div class="card-title">Unit 9</div>
      <div class="card-sub">2209 Branch Ave Anoka, MN 55303</div>
    </a>
  </div>

  <script>
    document.querySelectorAll('.card').forEach((card) => {
      const video = card.querySelector('video');
      card.addEventListener('mouseenter', () => { video.play().catch(() => {}); });
      card.addEventListener('mouseleave', () => { video.pause(); video.currentTime = 0; });
    });
  </script>
</body>
</html>
