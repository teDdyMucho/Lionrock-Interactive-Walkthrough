<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Rock — Video</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@400;500&display=swap');

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    background:#0c0c0c;
    color:#f5f3ee;
    font-family:'Inter',sans-serif;
  }
  a{ color:inherit; text-decoration:none; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 44px;
  }
  header img{ height:28px; }

  .back{
    font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    opacity:.5; transition:opacity .25s ease;
  }
  .back:hover{ opacity:1; }

  main{ padding:0 44px 64px; max-width:1100px; margin:0 auto; }

  .player{
    background:#000;
    border:1px solid rgba(245,243,238,.14);
    aspect-ratio:16/9;
  }
  .player video{ width:100%; height:100%; display:block; object-fit:contain; }

  .meta{ padding:26px 2px 0; }
  h1{
    font-family:'Playfair Display',serif;
    font-weight:500; font-size:1.7rem;
  }
  .address{ font-size:.86rem; opacity:.55; margin-top:6px; }
  .description{
    font-size:.88rem; line-height:1.7; opacity:.72;
    margin-top:16px; max-width:62ch;
  }

  .share{
    display:inline-flex; align-items:center; gap:9px;
    margin-top:26px; padding:12px 22px;
    border:1px solid rgba(245,243,238,.3);
    background:transparent; color:#f5f3ee;
    font-family:'Inter',sans-serif;
    font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    cursor:pointer;
    transition:border-color .25s ease, background .25s ease;
  }
  .share:hover{ border-color:rgba(245,243,238,.75); background:rgba(245,243,238,.06); }
  .share svg{ width:14px; height:14px; }

  #status{ padding:60px 44px; font-size:.9rem; opacity:.55; }
  #status:empty{ padding:0; }

  @media (max-width:600px){
    header{ padding:20px 22px; }
    main{ padding:0 22px 44px; }
    h1{ font-size:1.35rem; }
  }
</style>
</head>
<body>

  <header>
    <img src="/assets/img/lion-rock-logo.png" alt="Lion Rock">
    <a class="back" href="/">All projects</a>
  </header>

  <p id="status">Loading…</p>

  <main id="content" hidden>
    <div class="player">
      <video id="player" controls playsinline preload="metadata"></video>
    </div>

    <div class="meta">
      <h1 id="title"></h1>
      <p class="address" id="address"></p>
      <p class="description" id="description"></p>

      <button class="share" id="share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"></circle>
          <circle cx="6" cy="12" r="3"></circle>
          <circle cx="18" cy="19" r="3"></circle>
          <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"></line>
          <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"></line>
        </svg>
        <span id="share-label">Share</span>
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/view.js"></script>
</body>
</html>
