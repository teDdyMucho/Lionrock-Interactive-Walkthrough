<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Lion Rock — Video Walkthrough</title>
<link rel="stylesheet" href="/walkthrough/assets/style.css">
<link rel="stylesheet" href="/walkthrough/assets/guide.css">
<meta name="theme-color" content="#0c0c0c">
<style>
  /* This player is click-driven: clicking a room in the header plays that
     room's clip. No scrub engine. */
  html,body{ overflow:hidden; }

  /* No crossfade between clips. Every clip is a preloaded blob, so the swap is
     instant anyway — and a fade meant the first quarter-second of each clip
     played while still transparent. */
  #stage video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    opacity:0;
  }
  #stage video.active{ opacity:1; }

  #walkthrough-error{
    position:fixed; inset:0; z-index:1200;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:40px; text-align:center;
    background:#0c0c0c;
  }
  #walkthrough-error.show{ display:flex; }
  #walkthrough-error p{
    font-family:'Playfair Display',serif;
    font-size:1.15rem; max-width:34ch; line-height:1.6;
  }
  #walkthrough-error a{
    font-size:.75rem; letter-spacing:.1em; text-transform:uppercase;
    padding:12px 26px; border:1px solid rgba(245,243,238,.35);
  }
  #walkthrough-error a:hover{ border-color:rgba(245,243,238,.8); }
</style>
</head>
<body>

  <!-- Plain black while downloading: playing a room clip behind the progress
       bar spoils the walkthrough before it has finished loading, and decodes a
       video the viewer isn't watching yet. -->
  <div id="loader">
    <div class="loader-overlay">
      <div class="loader-brand">Lion Rock</div>
      <div class="loader-bar-track">
        <div class="loader-bar-fill" id="loader-bar-fill"></div>
      </div>
      <div class="loader-label" id="loader-label">Loading walkthrough… 0%</div>
    </div>
  </div>

  <div id="walkthrough-error">
    <p id="walkthrough-error-text"></p>
    <a href="/">← Back to gallery</a>
  </div>

  <header id="site-header">
    <a href="/" id="brand-link" class="brand">
      <img src="/assets/img/lion-rock-logo.png" alt="Lion Rock">
    </a>
    <div id="header-right">
      <nav id="room-nav" aria-label="Room navigation"></nav>
      <a href="/" id="back-to-gallery" title="Back to gallery">← Gallery</a>
    </div>
  </header>

  <!-- Dot navigation: same room list as the header, easier to hit on a phone -->
  <div id="dot-nav" aria-hidden="true"></div>

  <!-- Two elements so the next clip can be buffered while the current one plays -->
  <main id="stage">
    <video id="video-a" muted playsinline preload="auto"></video>
    <video id="video-b" muted playsinline preload="auto"></video>
  </main>

  <div id="footer-overlay">
    <p id="footer-note"></p>
  </div>

  <!-- First-visit guide: three steps, dismissed by tapping/clicking anywhere -->
  <div id="guide">
    <div class="guide-step" data-step="0">
      <svg class="guide-mouse" viewBox="0 0 60 110" fill="none" stroke="currentColor" aria-hidden="true">
        <rect x="12" y="4" width="36" height="56" rx="18" stroke-width="3"/>
        <circle cx="30" cy="18" r="4" fill="currentColor" stroke="none"/>
        <circle cx="30" cy="30" r="2.5" fill="currentColor" stroke="none" opacity=".8"/>
        <circle cx="30" cy="39" r="2.5" fill="currentColor" stroke="none" opacity=".6"/>
        <line x1="30" y1="48" x2="30" y2="92" stroke-width="3"/>
        <polyline points="18,80 30,96 42,80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="guide-text" id="guide-text-0">Scroll Down for the Next Room</p>
    </div>

    <div class="guide-step" data-step="1">
      <svg class="guide-mouse" viewBox="0 0 60 110" fill="none" stroke="currentColor" aria-hidden="true">
        <polyline points="18,26 30,10 42,26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="30" y1="14" x2="30" y2="58" stroke-width="3"/>
        <rect x="12" y="46" width="36" height="56" rx="18" stroke-width="3"/>
        <circle cx="30" cy="60" r="2.5" fill="currentColor" stroke="none" opacity=".6"/>
        <circle cx="30" cy="69" r="2.5" fill="currentColor" stroke="none" opacity=".8"/>
        <circle cx="30" cy="82" r="4" fill="currentColor" stroke="none"/>
      </svg>
      <p class="guide-text" id="guide-text-1">Scroll Up to Go Back</p>
    </div>

    <!-- Step 3 points at a real control, so it's anchored, not centred -->
    <div class="guide-step guide-pointer" data-step="2" id="guide-nav">
      <div class="guide-ring"></div>
      <p class="guide-text">Click to jump<br>straight to a Room</p>
    </div>

    <div class="guide-step guide-pointer" data-step="3" id="guide-gallery">
      <div class="guide-ring"></div>
      <p class="guide-text">Click to return<br>to Gallery</p>
    </div>

    <p class="guide-hint" id="guide-hint">Click anywhere to continue</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <!-- ?v= is a cache buster: without it the browser and CDN keep serving an old
       main.js and code changes appear to do nothing. Bump it on every JS edit. -->
  <script src="/walkthrough/assets/video-cache.js?v=2"></script>
  <script src="/video/assets/rooms-source.js?v=3"></script>
  <script src="/video/assets/main.js?v=5"></script>
</body>
</html>
