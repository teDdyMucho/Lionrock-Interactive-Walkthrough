backend:
  name: git-gateway
  branch: main

# Lets you test the CMS locally with `npx decap-server` before Identity/Git Gateway are set up.
# Netlify ignores this in production once the site is served over https.
local_backend: true

collections:
  - name: "walkthrough"
    label: "Walkthrough"
    files:
      # Each project gets its own entry here, with media/public folders scoped to
      # its own subfolder so uploads for one project never land in another's.
      - file: "2209-Branch-Ave-Anoka-MN-55303/content/rooms.json"
        label: "2209 Branch Ave Anoka, MN 55303 — Unit 9"
        name: "unit9"
        media_folder: "/2209-Branch-Ave-Anoka-MN-55303/videos/2209-branch-ave"
        public_folder: "/2209-Branch-Ave-Anoka-MN-55303/videos/2209-branch-ave"
        fields:
          - label: "Property"
            name: "property"
            widget: "object"
            fields:
              - { label: "Brand Name (logo text)", name: "brand", widget: "string" }
              - { label: "Logo Link URL", name: "logoLink", widget: "string" }
              - { label: "Unit / Project Title", name: "title", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Eyebrow Text", name: "eyebrow", widget: "string" }
              - { label: "Intro / Loading Background Video", name: "introVideo", widget: "file" }
              - { label: "Footer Note", name: "footerNote", widget: "text" }
          - label: "Rooms"
            name: "rooms"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Nav Label", name: "label", widget: "string" }
              - { label: "Room Video", name: "video", widget: "file" }
