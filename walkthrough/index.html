<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Lion Rock — Virtual Walkthrough</title>
<link rel="stylesheet" href="/walkthrough/assets/style.css">
<meta name="theme-color" content="#0c0c0c">
<style>
  /* Shown instead of the loader when a property has no videos / doesn't exist,
     so the page never hangs on a spinner with no explanation. */
  #walkthrough-error{
    position:fixed; inset:0; z-index:1200;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:40px; text-align:center;
    background:#0c0c0c;
  }
  #walkthrough-error.show{ display:flex; }
  #walkthrough-error p{
    font-family:'Playfair Display',serif;
    font-size:1.15rem; max-width:34ch; line-height:1.6;
  }
  #walkthrough-error a{
    font-size:.75rem; letter-spacing:.1em; text-transform:uppercase;
    padding:12px 26px; border:1px solid rgba(245,243,238,.35);
  }
  #walkthrough-error a:hover{ border-color:rgba(245,243,238,.8); }

  /* ---------- Offline download prompt (shown before the walkthrough loads) ---------- */
  #cache-prompt{
    position:fixed; inset:0; z-index:1300;
    display:none; align-items:center; justify-content:center;
    padding:24px;
    background:#0c0c0c;
  }
  #cache-prompt.show{ display:flex; }

  .cache-card{
    width:min(430px,100%);
    border:1px solid rgba(245,243,238,.18);
    padding:32px 34px 28px;
    text-align:center;
  }
  .cache-card h2{
    font-family:'Playfair Display',serif;
    font-weight:500; font-size:1.3rem;
    margin-bottom:12px;
  }
  .cache-card p{
    font-size:.85rem; line-height:1.65; opacity:.6;
    margin-bottom:8px;
  }
  .cache-size{
    font-size:.72rem; letter-spacing:.08em; text-transform:uppercase;
    opacity:.45; margin-bottom:24px;
  }

  .cache-actions{
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  }
  .cache-actions button{
    flex:1 1 130px;
    padding:13px 20px; cursor:pointer;
    border:1px solid rgba(245,243,238,.3);
    background:transparent; color:#f5f3ee;
    font-family:'Inter',sans-serif;
    font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    transition:border-color .2s ease, background .2s ease;
  }
  .cache-actions button:hover:not(:disabled){
    border-color:rgba(245,243,238,.8); background:rgba(245,243,238,.06);
  }
  .cache-actions .yes{ background:#f5f3ee; color:#0c0c0c; border-color:#f5f3ee; }
  .cache-actions .yes:hover:not(:disabled){ background:#fff; }
  .cache-actions button:disabled{ opacity:.4; cursor:not-allowed; }

  #cache-progress{ display:none; margin-top:22px; }
  #cache-progress.show{ display:block; }
  .cache-bar-track{ width:100%; height:2px; background:rgba(245,243,238,.2); }
  .cache-bar-fill{ height:100%; width:0; background:#f5f3ee; transition:width .25s ease; }
  #cache-progress-label{
    margin-top:10px;
    font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; opacity:.7;
  }

  #cache-note{ margin-top:18px; font-size:.72rem; opacity:.45; }
  #cache-note button{
    background:none; border:none; padding:0; cursor:pointer;
    color:#f5f3ee; font-family:'Inter',sans-serif; font-size:.72rem;
    text-decoration:underline; text-underline-offset:3px; opacity:.8;
  }
  #cache-note.error{ color:#d99; opacity:1; }
</style>
</head>
<body>

  <!-- Cache / preload loader -->
  <div id="loader">
    <video id="loader-video" muted loop playsinline autoplay></video>
    <div class="loader-overlay">
      <div class="loader-brand">Lion Rock</div>
      <div class="loader-bar-track">
        <div class="loader-bar-fill" id="loader-bar-fill"></div>
      </div>
      <div class="loader-label" id="loader-label">Loading walkthrough… 0%</div>
    </div>
  </div>

  <div id="walkthrough-error">
    <p id="walkthrough-error-text"></p>
    <a href="/">← Back to gallery</a>
  </div>

  <!-- Asked once, before the walkthrough loads -->
  <div id="cache-prompt">
    <div class="cache-card">
      <h2>Save for offline?</h2>
      <p>Keep this walkthrough on your device so it opens instantly next time and works without a connection.</p>
      <div class="cache-size" id="cache-size"></div>

      <div class="cache-actions">
        <button type="button" class="yes" id="cache-yes">Yes, download</button>
        <button type="button" id="cache-no">No thanks</button>
      </div>

      <div id="cache-progress">
        <div class="cache-bar-track"><div class="cache-bar-fill" id="cache-bar-fill"></div></div>
        <div id="cache-progress-label">Downloading… 0%</div>
      </div>

      <p id="cache-note"></p>
    </div>
  </div>

  <!-- Header / navigation -->
  <header id="site-header">
    <a href="/" id="brand-link" class="brand">
      <img src="/assets/img/lion-rock-logo.png" alt="Lion Rock">
    </a>
    <div id="header-right">
      <nav id="room-nav" aria-label="Room navigation"></nav>
      <a href="/" id="back-to-gallery" title="Back to gallery">← Gallery</a>
    </div>
  </header>

  <!-- Dot navigation: each row is a nav label paired with its bullet -->
  <div id="dot-nav" aria-hidden="true"></div>

  <!-- Single pinned video stage: scrolling scrubs one continuous timeline across all rooms -->
  <main id="stage">
    <video id="video-a" muted playsinline></video>
    <video id="video-b" muted playsinline></video>
  </main>

  <!-- Footer text, overlaid over the walkthrough instead of a separate scroll section -->
  <div id="footer-overlay">
    <p id="footer-note"></p>
  </div>

  <!-- Mobile only: fullscreen has to be requested from a real tap, so it's a button, not automatic -->
  <div id="fullscreen-modal">
    <p>For the best view, continue in fullscreen.</p>
    <button type="button" id="fullscreen-continue">Continue</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/walkthrough/assets/video-cache.js"></script>
  <script src="/walkthrough/assets/rooms-source.js"></script>
  <script src="/walkthrough/assets/main.js"></script>
</body>
</html>
