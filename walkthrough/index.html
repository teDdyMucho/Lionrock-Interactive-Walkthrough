<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Lion Rock — Virtual Walkthrough</title>
<link rel="stylesheet" href="/walkthrough/assets/style.css">
<meta name="theme-color" content="#0c0c0c">
<style>
  /* Shown instead of the loader when a property has no videos / doesn't exist,
     so the page never hangs on a spinner with no explanation. */
  #walkthrough-error{
    position:fixed; inset:0; z-index:1200;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:40px; text-align:center;
    background:#0c0c0c;
  }
  #walkthrough-error.show{ display:flex; }
  #walkthrough-error p{
    font-family:'Playfair Display',serif;
    font-size:1.15rem; max-width:34ch; line-height:1.6;
  }
  #walkthrough-error a{
    font-size:.75rem; letter-spacing:.1em; text-transform:uppercase;
    padding:12px 26px; border:1px solid rgba(245,243,238,.35);
  }
  #walkthrough-error a:hover{ border-color:rgba(245,243,238,.8); }

  /* ---------- First-visit guide ---------- */
  /* Sits above the stage but BELOW the header (z 100), so the nav links the
     last two steps point at stay sharp and visible. */
  #guide{
    position:fixed; inset:0; z-index:95;
    display:none;
    background:rgba(12,12,12,.55);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    cursor:pointer;
    animation:guide-in .4s ease;
  }
  #guide.show{ display:block; }
  @keyframes guide-in{ from{ opacity:0 } to{ opacity:1 } }

  /* The header sits above the guide (z 100) so the controls being pointed at
     stay sharp — but that also leaves them clickable, and a real nav jump
     mid-guide would be confusing. Disable them for the duration. */
  body.guide-open #site-header{ pointer-events:none; }

  .guide-step{
    display:none;
    position:absolute;
    align-items:center; gap:26px;
    color:#f5f3ee;
  }
  .guide-step.active{ display:flex; }

  /* Steps 1 & 2 sit centred over the video */
  .guide-step[data-step="0"], .guide-step[data-step="1"]{
    top:50%; left:50%; transform:translate(-50%,-50%);
  }

  .guide-mouse{
    width:78px; height:auto; flex:none;
    filter:drop-shadow(0 2px 12px rgba(0,0,0,.6));
  }

  .guide-text{
    font-family:'Playfair Display',serif;
    font-size:2.1rem; line-height:1.25;
    text-shadow:0 2px 14px rgba(0,0,0,.75);
  }

  /* Steps 3 & 4 are anchored under the header control they describe */
  .guide-pointer{
    flex-direction:column; align-items:center;
    gap:26px; /* clears the ring's stem */
    text-align:center;
  }
  /* The step box is sized to the ring; the label is free to be wider than it
     without pushing the ring off-centre. */
  .guide-pointer .guide-text{
    font-size:1.5rem;
    white-space:nowrap;
    width:max-content;
    margin:0 auto;
  }

  /* The ellipse drawn around the targeted control. Width/height are set from
     the target at runtime (see anchorTo), so these are only fallbacks. */
  .guide-ring{
    position:relative;
    width:104px; height:34px;
    border:2px solid #f5f3ee;
    border-radius:50%;
    box-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  /* short stem from the bottom of the ring down toward the label */
  .guide-ring::after{
    content:'';
    position:absolute;
    top:100%; left:50%;
    width:2px; height:20px;
    margin-left:-1px;
    background:#f5f3ee;
  }

  .guide-hint{
    position:absolute; left:0; right:0; bottom:46px;
    text-align:center;
    font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    opacity:.5;
  }

  @media (max-width:820px){
    .guide-text{ font-size:1.4rem; }
    .guide-pointer .guide-text{ font-size:1rem; }
    .guide-mouse{ width:56px; }
    .guide-step{ gap:16px; }
    .guide-ring{ width:78px; height:26px; }
  }

</style>
</head>
<body>

  <!-- Cache / preload loader -->
  <div id="loader">
    <video id="loader-video" muted loop playsinline autoplay></video>
    <div class="loader-overlay">
      <div class="loader-brand">Lion Rock</div>
      <div class="loader-bar-track">
        <div class="loader-bar-fill" id="loader-bar-fill"></div>
      </div>
      <div class="loader-label" id="loader-label">Loading walkthrough… 0%</div>
    </div>
  </div>

  <div id="walkthrough-error">
    <p id="walkthrough-error-text"></p>
    <a href="/">← Back to gallery</a>
  </div>

  <!-- Header / navigation -->
  <header id="site-header">
    <a href="/" id="brand-link" class="brand">
      <img src="/assets/img/lion-rock-logo.png" alt="Lion Rock">
    </a>
    <div id="header-right">
      <nav id="room-nav" aria-label="Room navigation"></nav>
      <a href="/" id="back-to-gallery" title="Back to gallery">← Gallery</a>
    </div>
  </header>

  <!-- Dot navigation: each row is a nav label paired with its bullet -->
  <div id="dot-nav" aria-hidden="true"></div>

  <!-- Single pinned video stage: scrolling scrubs one continuous timeline across all rooms -->
  <main id="stage">
    <video id="video-a" muted playsinline></video>
    <video id="video-b" muted playsinline></video>
  </main>

  <!-- Footer text, overlaid over the walkthrough instead of a separate scroll section -->
  <div id="footer-overlay">
    <p id="footer-note"></p>
  </div>

  <!-- First-visit guide: four steps, dismissed by tapping/clicking anywhere -->
  <div id="guide">
    <div class="guide-step" data-step="0">
      <svg class="guide-mouse" viewBox="0 0 60 110" fill="none" stroke="currentColor" aria-hidden="true">
        <rect x="12" y="4" width="36" height="56" rx="18" stroke-width="3"/>
        <circle cx="30" cy="18" r="4" fill="currentColor" stroke="none"/>
        <circle cx="30" cy="30" r="2.5" fill="currentColor" stroke="none" opacity=".8"/>
        <circle cx="30" cy="39" r="2.5" fill="currentColor" stroke="none" opacity=".6"/>
        <line x1="30" y1="48" x2="30" y2="92" stroke-width="3"/>
        <polyline points="18,80 30,96 42,80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="guide-text" id="guide-text-0">Scroll Down to Continue</p>
    </div>

    <div class="guide-step" data-step="1">
      <svg class="guide-mouse" viewBox="0 0 60 110" fill="none" stroke="currentColor" aria-hidden="true">
        <polyline points="18,26 30,10 42,26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="30" y1="14" x2="30" y2="58" stroke-width="3"/>
        <rect x="12" y="46" width="36" height="56" rx="18" stroke-width="3"/>
        <circle cx="30" cy="60" r="2.5" fill="currentColor" stroke="none" opacity=".6"/>
        <circle cx="30" cy="69" r="2.5" fill="currentColor" stroke="none" opacity=".8"/>
        <circle cx="30" cy="82" r="4" fill="currentColor" stroke="none"/>
      </svg>
      <p class="guide-text" id="guide-text-1">Scroll Up to Return</p>
    </div>

    <!-- Steps 3 & 4 point at real header controls, so they're anchored, not centred -->
    <div class="guide-step guide-pointer" data-step="2" id="guide-nav">
      <div class="guide-ring"></div>
      <p class="guide-text">Click to instantly<br>go to this Room</p>
    </div>

    <div class="guide-step guide-pointer" data-step="3" id="guide-gallery">
      <div class="guide-ring"></div>
      <p class="guide-text">Click to return<br>to Gallery</p>
    </div>

    <p class="guide-hint" id="guide-hint">Click anywhere to continue</p>
  </div>

  <!-- Mobile only: fullscreen has to be requested from a real tap, so it's a button, not automatic -->
  <div id="fullscreen-modal">
    <p>For the best view, continue in fullscreen.</p>
    <button type="button" id="fullscreen-continue">Continue</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/walkthrough/assets/video-cache.js"></script>
  <script src="/walkthrough/assets/rooms-source.js"></script>
  <script src="/walkthrough/assets/main.js"></script>
</body>
</html>
